---
# roles/docker/tasks/debian.yml
- name: Install required packages (Debian/Ubuntu)
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  become: yes
  with_items:
    - apt-transport-https
    - ca-certificates
    - curl
    - gnupg
    - lsb-release

- name: Add Docker GPG key (Debian/Ubuntu)
  apt_key:
    url: https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg
    state: present
  become: yes

- name: Add Docker repository (Debian/Ubuntu)
  apt_repository:
    repo: "deb [arch=amd64] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    state: present
  become: yes

- name: Install Docker packages (Debian/Ubuntu)
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  become: yes
  with_items:
    - docker-ce
    - docker-ce-cli
    - containerd.io

- name: Ensure docker service is running and enabled (Debian/Ubuntu)
  systemd:
    name: docker
    state: started
    enabled: yes
  become: yes

- name: Add current user to docker group (Debian/Ubuntu)
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: yes
  become: yes