---
# roles/java/tasks/redhat.yml
- name: Install OpenJDK (RHEL/CentOS)
  yum:
    name: java-11-openjdk-devel
    state: present
  become: yes

- name: Set JAVA_HOME environment variable (RHEL/CentOS)
  lineinfile:
    path: /etc/environment
    line: 'JAVA_HOME="/usr/lib/jvm/java-11-openjdk"'
    state: present
  become: yes