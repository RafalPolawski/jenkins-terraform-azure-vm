---
# roles/java/tasks/main.yml
- name: Install default JDK
  apt:
    name: default-jdk
    state: present
    update_cache: yes
  become: yes

- name: Set JAVA_HOME environment variable
  lineinfile:
    path: /etc/environment
    line: 'JAVA_HOME="/usr/lib/jvm/default-java"'
    state: present
  become: yes