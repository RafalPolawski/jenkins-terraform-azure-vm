---
# roles/python/tasks/debian.yml
- name: Install Python and required packages (Debian/Ubuntu)
  apt:
    name: "{{ item }}"
    state: present
    update_cache: yes
  become: yes
  with_items:
    - python3
    - python3-pip
    - python3-dev
    - python3-venv
    - build-essential
    - libssl-dev
    - libffi-dev

- name: Create symlink for python command (Debian/Ubuntu)
  file:
    src: /usr/bin/python3
    dest: /usr/bin/python
    state: link
  become: yes
  ignore_errors: yes

- name: Upgrade pip to latest version (Debian/Ubuntu)
  pip:
    name: pip
    state: latest
  become: yes